name: Build CLI and Server

on:
  push:
    branches:
      - '**'
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
      is_release:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Never let go.mod's minimum version silently select an old, unpatched Go.
env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: linux-arm
            goos: linux
            goarch: arm
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: .exe
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'   # latest 1.26 patch release (security fixes)
          check-latest: true

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            # Use latest tag if available, otherwise use short SHA
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$VERSION" ]; then
              VERSION="dev-$(git rev-parse --short HEAD)"
            else
              VERSION="${VERSION#v}"
            fi
          fi
          case "${VERSION}" in
            *[!0-9A-Za-z.+-]*) echo "Invalid version string: ${VERSION}"; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Download and verify dependencies
        run: go mod download && go mod verify

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p "build/${TARGET}"
          go build \
            -ldflags="-w -s -X main.Version=${VERSION}" \
            -o "build/${TARGET}/quietroom_server-${TARGET}-v${VERSION}${EXT}" \
            quietroom_server.go

      - name: Build CLI client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          go build \
            -ldflags="-w -s -X main.Version=${VERSION}" \
            -o "build/${TARGET}/quietroom_client-${TARGET}-v${VERSION}${EXT}" \
            quietroom_client.go

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quietroom-cli-${{ matrix.target }}
          path: build/${{ matrix.target }}/
          retention-days: 7