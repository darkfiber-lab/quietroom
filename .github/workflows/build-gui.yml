name: Build GUI Client

on:
  push:
    branches:
      - '**'
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
      is_release:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Never let go.mod's minimum version silently select an old, unpatched Go.
env:
  GOTOOLCHAIN: local

jobs:

  # ── Linux builds ───────────────────────────────────────────────
  build-linux:
    name: Build Linux ${{ matrix.goarch }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            target: linux-amd64
          - goarch: arm64
            target: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'   # latest 1.26 patch release (security fixes)
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$VERSION" ]; then
              VERSION="dev-$(git rev-parse --short HEAD)"
            else
              VERSION="${VERSION#v}"
            fi
          fi
          case "${VERSION}" in
            *[!0-9A-Za-z.+-]*) echo "Invalid version string: ${VERSION}"; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies (amd64)
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt update
          sudo apt install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      - name: Install system dependencies (arm64 cross)
        if: matrix.goarch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt update
          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libgtk-3-dev:arm64 \
            libwebkit2gtk-4.0-dev:arm64

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0   # same version as quietroom-gui/go.mod

      - name: Install frontend dependencies
        run: cd quietroom-gui/frontend && npm ci

      - name: Build (amd64)
        if: matrix.goarch == 'amd64'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          cd quietroom-gui
          wails build \
            -platform linux/amd64 \
            -o quietroom_client_gui \
            -ldflags "-X main.Version=${VERSION}"
          mkdir -p "dist/${TARGET}"
          cp build/bin/quietroom_client_gui \
            "dist/${TARGET}/quietroom_client_gui-${TARGET}-v${VERSION}"

      - name: Build (arm64 cross)
        if: matrix.goarch == 'arm64'
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          cd quietroom-gui
          GOOS=linux GOARCH=arm64 \
          CC=$CC CXX=$CXX \
          wails build \
            -platform linux/arm64 \
            -o quietroom_client_gui \
            -ldflags "-X main.Version=${VERSION}"
          mkdir -p "dist/${TARGET}"
          cp build/bin/quietroom_client_gui \
            "dist/${TARGET}/quietroom_client_gui-${TARGET}-v${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quietroom-gui-${{ matrix.target }}
          path: quietroom-gui/dist/${{ matrix.target }}/
          retention-days: 7

  # ── macOS builds ───────────────────────────────────────────────
  build-macos:
    name: Build macOS ${{ matrix.goarch }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            target: darwin-amd64
          - goarch: arm64
            target: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'   # latest 1.26 patch release (security fixes)
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$VERSION" ]; then
              VERSION="dev-$(git rev-parse --short HEAD)"
            else
              VERSION="${VERSION#v}"
            fi
          fi
          case "${VERSION}" in
            *[!0-9A-Za-z.+-]*) echo "Invalid version string: ${VERSION}"; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0   # same version as quietroom-gui/go.mod

      - name: Install frontend dependencies
        run: cd quietroom-gui/frontend && npm ci

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.goarch }}
        run: |
          cd quietroom-gui
          GOOS=darwin GOARCH="${ARCH}" \
          wails build \
            -platform "darwin/${ARCH}" \
            -o quietroom_client_gui \
            -ldflags "-X main.Version=${VERSION}"
          mkdir -p "dist/${TARGET}"
          cp -r build/bin/QuietRoom.app \
            "dist/${TARGET}/quietroom_client_gui-${TARGET}-v${VERSION}.app"
          cd "dist/${TARGET}"
          zip -r \
            "quietroom_client_gui-${TARGET}-v${VERSION}.zip" \
            "quietroom_client_gui-${TARGET}-v${VERSION}.app"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quietroom-gui-${{ matrix.target }}
          path: quietroom-gui/dist/${{ matrix.target }}/*.zip
          retention-days: 7

  # ── Windows build ───────────────────────────────────────────────
  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'   # latest 1.26 patch release (security fixes)
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$VERSION" ]; then
              VERSION="dev-$(git rev-parse --short HEAD)"
            else
              VERSION="${VERSION#v}"
            fi
          fi
          case "${VERSION}" in
            *[!0-9A-Za-z.+-]*) echo "Invalid version string: ${VERSION}"; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0   # same version as quietroom-gui/go.mod

      - name: Install frontend dependencies
        run: cd quietroom-gui/frontend && npm ci

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd quietroom-gui
          GOOS=windows GOARCH=amd64 \
          wails build \
            -platform windows/amd64 \
            -o quietroom_client_gui \
            -ldflags "-X main.Version=${VERSION}"
          mkdir -p dist/windows-amd64
          if [ -f build/bin/quietroom_client_gui.exe ]; then
            SRC="build/bin/quietroom_client_gui.exe"
          else
            SRC="build/bin/quietroom_client_gui"
          fi
          cp "$SRC" \
            "dist/windows-amd64/quietroom_client_gui-windows-amd64-v${VERSION}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quietroom-gui-windows-amd64
          path: quietroom-gui/dist/windows-amd64/
          retention-days: 7