name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:

  # ── Determine version from latest tag ──────────────────────────
  version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        run: |
          # Use the latest tag if it points to this commit, otherwise
          # create a version from the tag + commit count since it
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          EXACT=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")

          if [ -n "$EXACT" ]; then
            # This commit is exactly on a tag
            VERSION="${EXACT#v}"
          else
            # Commits since last tag — create a prerelease version
            COMMITS=$(git rev-list ${TAG}..HEAD --count)
            SHORT=$(git rev-parse --short HEAD)
            VERSION="${TAG#v}-pre.${COMMITS}+${SHORT}"
          fi

          case "${VERSION}" in
            *[!0-9A-Za-z.+-]*) echo "Invalid version string: ${VERSION}"; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

  # ── Build CLI and server ────────────────────────────────────────
  build-cli:
    name: Build CLI + Server
    needs: version
    uses: ./.github/workflows/build-cli.yml
    with:
      version: ${{ needs.version.outputs.version }}
      is_release: true

  # ── Build GUI ───────────────────────────────────────────────────
  build-gui:
    name: Build GUI
    needs: version
    uses: ./.github/workflows/build-gui.yml
    with:
      version: ${{ needs.version.outputs.version }}
      is_release: true

  # ── Create GitHub Release ───────────────────────────────────────
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    needs: [version, build-cli, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload files
      id-token: write       # sign the build provenance (Sigstore)
      attestations: write   # store the provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all CLI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/cli/
          pattern: quietroom-cli-*
          merge-multiple: false

      - name: Download all GUI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/gui/
          pattern: quietroom-gui-*
          merge-multiple: false

      - name: Prepare release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release

          # Package CLI artifacts — one zip per platform. Artifact downloads
          # lose file permissions, so the binaries are made executable again
          # before zipping; zip stores the mode and unzip restores it.
          for dir in artifacts/cli/*/; do
            platform=$(basename "$dir")
            platform="${platform#quietroom-cli-}"
            if [ -d "$dir" ]; then
              chmod 0755 "$dir"/*
              zip -j "release/quietroom-cli-${platform}-v${VERSION}.zip" "$dir"/*
              # Every entry must be executable (-rwxr-xr-x), or the release fails.
              if zipinfo "release/quietroom-cli-${platform}-v${VERSION}.zip" | awk '/^-/ && $1 !~ /^-rwx/ { bad = 1; print "not executable: " $NF } END { exit bad }'; then :; else
                echo "::error::binaries without execute permission in quietroom-cli-${platform}-v${VERSION}.zip"
                exit 1
              fi
            fi
          done

          # Copy GUI artifacts — already zipped for macOS, flat files for others
          find artifacts/gui/ -type f \( -name "*.zip" -o -name "*.exe" -o -name "quietroom_client_gui-*" \) \
            -exec cp {} release/ \;

          echo "Release files:"
          ls -lah release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'release/*'

      - name: Extract changelog for this version
        id: changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Extract the section for this version from CHANGELOG.md if it exists
          if [ -f CHANGELOG.md ]; then
            # Get content between this version header and the next --- separator
            NOTES=$(awk "/## \[${VERSION}\]/{found=1; next} found && (/^---/ || /^## \[/){exit} found{print}" CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              NOTES="See CHANGELOG.md for details."
            fi
          else
            NOTES="Release v${VERSION}"
          fi
          # Write to file to handle multiline
          echo "$NOTES" > release_notes.md
          cat release_notes.md

      # Uses the GitHub CLI preinstalled on the runner instead of a third-party
      # action, so no external code runs with the release-writing token.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          PRERELEASE=""
          case "${VERSION}" in
            *-pre.*|*-rc*|*-beta*|*-alpha*) PRERELEASE="--prerelease" ;;
          esac
          LATEST="--latest"
          case "${VERSION}" in
            *-pre.*) LATEST="--latest=false" ;;
          esac
          gh release create "${TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "QuietRoom v${VERSION}" \
            --notes-file release_notes.md \
            ${PRERELEASE} ${LATEST}
