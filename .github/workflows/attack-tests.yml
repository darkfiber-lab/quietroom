# Attack tests: hostile clients against a real server process (missing and
# forged access keys, invalid DH keys, malformed packets, command abuse,
# reconnect races, slow readers, connection floods, log privacy). The server
# is built with the race detector; a reported data race fails the run.

name: Attack Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '29 5 * * 1'   # weekly, Monday 05:29 UTC: new Go releases
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  attack-tests:
    name: Attack tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Run attack tests (race-enabled server)
        env:
          QUIETROOM_RACE: '1'
        run: go test -count=1 -timeout 10m -v ./tests/attack/
